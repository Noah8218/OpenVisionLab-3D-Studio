name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify vendored packages
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\verify-vision-sdk-package.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\verify-wpg-package.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\verify-integration-contracts-package.ps1

      - name: Restore
        run: dotnet restore OpenVisionLab.ThreeDStudio.slnx

      - name: Build
        run: dotnet build OpenVisionLab.ThreeDStudio.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --project tests\OpenVisionLab.ThreeD.Data.Tests\OpenVisionLab.ThreeD.Data.Tests.csproj -c Release --no-build --no-restore --minimum-expected-tests 2 --report-xunit-trx
